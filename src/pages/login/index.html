<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../css/style.css" />
    <link rel="stylesheet" href="./login.css" />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css"
      rel="stylesheet"
    />
    <title>Login</title>
  </head>
  <body>
    <header id="login-header">
      <h2>Logo aqui</h2>
      <nav id="login-navigation">
        <p style="color: #6a7e90; font-weight: 450">Ainda não tem acesso?</p>
        <a href="#">Solicitar acesso</a>
      </nav>
    </header>

    <main id="content">
      <div id="welcome-content">
        <div id="welcome-text">
          <h3
            style="font-weight: 650; text-transform: uppercase; color: #6a7e90"
          >
            Central de Antendimento
          </h3>
          <h1 style="font-weight: 550; font-size: 3rem; color: #161e36">
            Bom ter você de volta.
          </h1>
        </div>

        <h4 id="welcome-desc" style="font-weight: 400; color: #6a7e90cb">
          Acesse sua conta para abrir chamados, acompanhar<br />solicitações e
          conversar com a equipe de suporte.
        </h4>

        <p id="welcome-slogan">
          <i class="bx bx-check"></i>
          Suas solicitações, organizadas em um só lugar.
        </p>
      </div>

      <div id="login-form-container"></div>
    </main>
  </body>
</html>
